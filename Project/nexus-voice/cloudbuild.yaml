steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/nexusvoice-app:latest'
      - '-f'
      - 'Dockerfile.cloudrun'
      - '.'

images:
  - 'gcr.io/$PROJECT_ID/nexusvoice-app:latest'

timeout: '1800s'

options:
  machineType: 'E2_HIGHCPU_8'